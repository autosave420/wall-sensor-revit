name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile against Revit 2022 API
        shell: powershell
        run: ./scripts/build.ps1 -UseNuGetReferences
      - name: Check band boundaries and units
        shell: powershell
        run: ./scripts/test.ps1
